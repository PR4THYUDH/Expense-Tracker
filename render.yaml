services:
  - type: web
    name: finsight
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn expense_tracker_project.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,.prathyudh.dev,prathyudh.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://*.prathyudh.dev,https://prathyudh.dev
      - key: DATABASE_URL
        sync: false
